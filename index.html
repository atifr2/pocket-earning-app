<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Power - Real App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-gold: #fbbf24;
      --accent-pink: #ec4899;
      --text-white: #ffffff;
      --text-dim: #94a3b8;
      --radius: 18px;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg-gradient); color: var(--text-white); min-height: 100vh; padding-bottom: 90px; user-select: none; }

    /* Auth Screens */
    .auth-screen { position: fixed; inset: 0; background: #0f172a; z-index: 200; padding: 25px; display: flex; flex-direction: column; justify-content: center; }
    .auth-title { font-size: 24px; font-weight: 800; color: var(--accent-pink); margin-bottom: 20px; text-align: center; }

    /* Main UI Header */
    .app-header {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px);
      padding: 15px 20px; border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 90; display: flex; align-items: center; justify-content: space-between;
    }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .avatar-inner {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent-purple);
      display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .balance-badge {
      background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 6px 14px; border-radius: 30px; font-weight: 800; color: var(--accent-green); font-size: 14px;
    }

    .container { padding: 15px; }

    .glass-card {
      background: var(--card-bg); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 18px; margin-bottom: 15px;
    }

    .btn-action {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink)); color: #fff;
      font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.3s; margin-top: 5px;
    }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    .custom-input, .custom-select {
      width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border); border-radius: 10px; color: #fff;
      margin-bottom: 10px; font-size: 13px; outline: none;
    }
    .custom-select option { background: #0f172a; color: #fff; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
      display: flex; justify-content: space-around; padding: 10px 0;
      border-top: 1px solid var(--card-border); z-index: 100;
    }
    .nav-link {
      background: none; border: none; color: var(--text-dim);
      display: flex; flex-direction: column; align-items: center; font-size: 9px;
      font-weight: 700; cursor: pointer;
    }
    .nav-link i { font-size: 16px; margin-bottom: 3px; }
    .nav-link.active { color: var(--accent-pink); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- LOGIN / SIGNUP SCREEN -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-title">LOGIN / REGISTER</div>
    <input type="text" id="auth-phone" class="custom-input" placeholder="Phone Number (017XXXXXXXX)">
    <input type="password" id="auth-pass" class="custom-input" placeholder="Password">
    <button class="btn-action" onclick="loginUser()">LOGIN / REGISTER NOW</button>
  </div>

  <!-- MAIN APP -->
  <div class="app-header">
    <div class="user-profile">
      <div class="avatar-inner" id="user-avatar">U</div>
      <div>
        <div style="font-size: 13px; font-weight: 800;" id="user-phone-display">017XXXXXXXX</div>
        <div style="font-size: 10px; color: var(--text-dim);">Tasks: <span id="task-completed">0</span>/50</div>
      </div>
    </div>
    <div class="balance-badge">BDT <span id="balance">0.00</span></div>
  </div>

  <div class="container">

    <!-- TAB 1: AD TASKS -->
    <div id="tab-tasks" class="tab-content active">
      <div class="glass-card" style="text-align: center;">
        <h3 style="color: var(--accent-gold); font-size: 16px;">DAILY AD TASKS (50 ADS)</h3>
        <p style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">প্রতিটি ৩০ সেকেন্ড অ্যাড দেখলে BDT 7.00 জমা হবে</p>
        <div style="font-size: 24px; font-weight: 900; color: var(--accent-gold); margin: 10px 0;"><span id="ad-count">0</span> / 50</div>
        
        <button class="btn-action" id="watch-ad-btn" onclick="startAdTask()">
          <i class="fa-solid fa-play"></i> WATCH AD (30 SEC)
        </button>
      </div>
    </div>

    <!-- TAB 2: DEPOSIT -->
    <div id="tab-deposit" class="tab-content">
      <div class="glass-card">
        <h3 style="font-size: 15px; margin-bottom: 10px;">Deposit / Add Money</h3>
        <select class="custom-select" id="dep-method">
          <option value="bKash">bKash Personal (01700000000)</option>
          <option value="Nagad">Nagad Personal (01800000000)</option>
        </select>
        <input type="number" class="custom-input" placeholder="Amount (Min ৳200)" id="dep-amount">
        <input type="text" class="custom-input" placeholder="TrxID" id="dep-trx">
        <button class="btn-action" onclick="submitDeposit()">SUBMIT DEPOSIT</button>
      </div>
    </div>

    <!-- TAB 3: WITHDRAW -->
    <div id="tab-withdraw" class="tab-content">
      <div class="glass-card">
        <h3 style="font-size: 15px; margin-bottom: 8px;">Easy Withdraw</h3>
        <select class="custom-select" id="wit-method">
          <option>bKash Personal</option>
          <option>Nagad Personal</option>
        </select>
        <input type="text" class="custom-input" placeholder="Account Number" id="wit-num">
        <input type="number" class="custom-input" placeholder="Amount (Min ৳200)" id="wit-amt">
        <button class="btn-action" style="background: linear-gradient(90deg, #10b981, #059669);" onclick="submitWithdraw()">WITHDRAW NOW</button>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-link active" onclick="switchTab('tab-tasks', this)"><i class="fa-solid fa-list-check"></i>Tasks</button>
    <button class="nav-link" onclick="switchTab('tab-deposit', this)"><i class="fa-solid fa-wallet"></i>Deposit</button>
    <button class="nav-link" onclick="switchTab('tab-withdraw', this)"><i class="fa-solid fa-money-bill-transfer"></i>Withdraw</button>
  </div>

  <script>
    // ----------------------------------------------------
    // REPLACE THIS WITH YOUR FIREBASE CONFIG
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.app照.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = null;

    function switchTab(tabId, elem) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      elem.classList.add('active');
    }

    /* Auth System */
    async function loginUser() {
      const phone = document.getElementById('auth-phone').value.trim();
      const pass = document.getElementById('auth-pass').value.trim();

      if(phone.length < 11 || !pass) {
        alert('সঠিক ১১ ডিজিটের ফোন নম্বর এবং পাসওয়ার্ড দিন!');
        return;
      }

      const userRef = db.collection('users').doc(phone);
      const doc = await userRef.get();

      if (doc.exists) {
        if(doc.data().password === pass) {
          currentUser = doc.data();
        } else {
          alert('ভুল পাসওয়ার্ড!');
          return;
        }
      } else {
        // Register New User
        currentUser = {
          phone: phone,
          password: pass,
          balance: 0.00,
          tasksCompleted: 0
        };
        await userRef.set(currentUser);
      }

      document.getElementById('auth-screen').style.display = 'none';
      loadUserData();
    }

    function loadUserData() {
      db.collection('users').doc(currentUser.phone).onSnapshot(doc => {
        if(doc.exists) {
          const data = doc.data();
          document.getElementById('balance').innerText = data.balance.toFixed(2);
          document.getElementById('ad-count').innerText = data.tasksCompleted;
          document.getElementById('task-completed').innerText = data.tasksCompleted;
          document.getElementById('user-phone-display').innerText = data.phone;
        }
      });
    }

    /* Ad Task Real Update */
    async function startAdTask() {
      if(!currentUser) return;
      const userRef = db.collection('users').doc(currentUser.phone);
      const doc = await userRef.get();
      const data = doc.data();

      if(data.tasksCompleted >= 50) {
        alert('আজকের ৫০টি টাস্ক শেষ!');
        return;
      }

      // Adsterra / Monetag Link Open
      window.open('https://your-adsterra-link.com', '_blank');

      const btn = document.getElementById('watch-ad-btn');
      btn.disabled = true;

      setTimeout(async () => {
        await userRef.update({
          balance: firebase.firestore.FieldValue.increment(7.00),
          tasksCompleted: firebase.firestore.FieldValue.increment(1)
        });
        alert('BDT 7.00 আপনার অ্যাকাউন্টে রিয়েল-টাইম যোগ হয়েছে!');
        btn.disabled = false;
      }, 5000);
    }

    /* Deposit Request */
    async function submitDeposit() {
      const amt = parseFloat(document.getElementById('dep-amount').value);
      const trx = document.getElementById('dep-trx').value;
      const method = document.getElementById('dep-method').value;

      if(!amt || !trx) { alert('সব তথ্য পূরণ করুন!'); return; }

      await db.collection('deposits').add({
        phone: currentUser.phone,
        amount: amt,
        trx: trx,
        method: method,
        status: 'pending',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert('ডিপোজিট রিকুয়েস্ট এডমিন প্যানেলে জমা হয়েছে!');
      document.getElementById('dep-amount').value = '';
      document.getElementById('dep-trx').value = '';
    }

    /* Withdraw Request */
    async function submitWithdraw() {
      const amt = parseFloat(document.getElementById('wit-amt').value);
      const num = document.getElementById('wit-num').value;

      if(!amt || !num || amt < 200) { alert('কমপক্ষে ২০০ টাকা উইথড্র করতে হবে!'); return; }

      const userRef = db.collection('users').doc(currentUser.phone);
      const doc = await userRef.get();

      if(doc.data().balance < amt) {
        alert('পর্যাপ্ত ব্যালেন্স নেই!');
        return;
      }

      // Cut balance instantly
      await userRef.update({
        balance: firebase.firestore.FieldValue.increment(-amt)
      });

      await db.collection('withdraws').add({
        phone: currentUser.phone,
        amount: amt,
        number: num,
        status: 'pending',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert('উইথড্র রিকুয়েস্ট জমা হয়েছে! এডমিন এপ্রুভ করলে পেমেন্ট পেয়ে যাবেন।');
      document.getElementById('wit-amt').value = '';
      document.getElementById('wit-num').value = '';
    
  const firebaseConfig = {
    apiKey: "AIzaSyCKcM0cypXPxyXXtpdbLj9CKB9H0hPdtTc",
    authDomain: "pocketearnmoney-b1ae4.firebaseapp.com",
    projectId: "pocketearnmoney-b1ae4",
    storageBucket: "pocketearnmoney-b1ae4.firebasestorage.app",
    messagingSenderId: "407102622154",
    appId: "1:407102622154:web:ca2e8e32ce663a48362733",
    measurementId: "G-DDR98BBNDE"
  };
      firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

</body>
</html>
