
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Earn - Watch & Earn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --text-white: #ffffff;
      --text-dim: #94a3b8;
      --radius: 20px;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg-gradient); color: var(--text-white); min-height: 100vh; padding-bottom: 90px; }

    .auth-card {
      max-width: 400px; margin: 40px auto; padding: 25px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: var(--radius); backdrop-filter: blur(15px);
    }
    .auth-title { text-align: center; color: var(--accent-purple); margin-bottom: 20px; font-size: 22px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
    .input-group input {
      width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      border-radius: 10px; color: white; outline: none; font-size: 14px;
    }
    .btn-submit {
      width: 100%; padding: 14px; background: linear-gradient(90deg, #8b5cf6, #10b981); border: none;
      border-radius: 12px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px;
    }

    .app-header {
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(15px); padding: 15px 20px;
      position: sticky; top: 0; z-index: 90; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .container { padding: 15px; max-width: 500px; margin: auto; }
    .glass-card {
      background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 15px;
    }
    .hidden { display: none !important; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- AUTH SECTION -->
  <div id="auth-section" class="auth-card">
    <h2 class="auth-title"><i class="fas fa-user-plus"></i> SIGN UP / LOGIN</h2>
    
    <!-- Step 1: Info Form -->
    <div id="info-form">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Enter Full Name">
      </div>
      <div class="input-group">
        <label>Phone Number (with +880)</label>
        <input type="text" id="reg-phone" placeholder="+8801700000000">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Create Password">
      </div>
      <div id="recaptcha-container"></div>
      <button class="btn-submit" onclick="sendOTP()">Send OTP</button>
    </div>

    <!-- Step 2: OTP Form -->
    <div id="otp-form" class="hidden">
      <div class="input-group">
        <label>Enter 6-digit OTP Code</label>
        <input type="text" id="otp-code" placeholder="123456">
      </div>
      <button class="btn-submit" onclick="verifyOTP()">Verify OTP & Complete Registration</button>
    </div>
  </div>

  <!-- MAIN DASHBOARD (HIDDEN UNTIL LOGIN) -->
  <div id="dashboard-section" class="hidden">
    <div class="app-header">
      <div>
        <h4 id="user-display-name">User</h4>
        <small id="user-display-phone" style="color:var(--text-dim)"></small>
      </div>
      <div style="color:var(--accent-green); font-weight:bold;">
        Balance: ৳<span id="user-balance">0</span>
      </div>
    </div>

    <div class="container">
      <div class="glass-card" style="text-align: center;">
        <h3>Watch & Earn</h3>
        <p style="color: var(--text-dim); margin: 10px 0;">Complete tasks to earn real money</p>
        <button class="btn-submit" onclick="doTask()">Watch Ad (+৳5)</button>
      </div>

      <div class="glass-card">
        <h3>Withdraw Money</h3>
        <div class="input-group" style="margin-top:10px;">
          <input type="number" id="wit-amt" placeholder="Amount (Min ৳200)">
        </div>
        <div class="input-group">
          <input type="text" id="wit-num" placeholder="bKash/Nagad Number">
        </div>
        <button class="btn-submit" onclick="requestWithdraw()">Withdraw</button>
      </div>
    </div>
  </div>

  <script>
    // YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "AIzaSyCKcMDcypXPxyXXtpdbLj9CKB9H0hPdtTc",
      authDomain: "pocketearnmoney-b1ae4.firebaseapp.com",
      projectId: "pocketearnmoney-b1ae4",
      storageBucket: "pocketearnmoney-b1ae4.firebasestorage.app",
      messagingSenderId: "407102622154",
      appId: "1:407102622154:web:ca2e8e32ce663a48362733",
      measurementId: "G-D0R98BBN0E"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let confirmationResultGlobal = null;
    let tempUserData = {};

    window.onload = function() {
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
      });
    };

    function sendOTP() {
      const name = document.getElementById('reg-name').value;
      const phone = document.getElementById('reg-phone').value;
      const pass = document.getElementById('reg-pass').value;

      if(!name || !phone || !pass) {
        alert('Sob ghor puron korun!');
        return;
      }

      tempUserData = { name, phone, pass };

      const appVerifier = window.recaptchaVerifier;
      auth.signInWithPhoneNumber(phone, appVerifier)
        .then((confirmationResult) => {
          confirmationResultGlobal = confirmationResult;
          document.getElementById('info-form').classList.add('hidden');
          document.getElementById('otp-form').classList.remove('hidden');
          alert('Apnar mobile-e OTP pathano hoyeche!');
        }).catch((error) => {
          alert('OTP pathate somosya: ' + error.message);
        });
    }

    function verifyOTP() {
      const code = document.getElementById('otp-code').value;
      if(!code) return alert('OTP code din!');

      confirmationResultGlobal.confirm(code).then((result) => {
        const user = result.user;
        
        // Save user data to Firestore
        db.collection('users').doc(user.uid).set({
          name: tempUserData.name,
          phone: tempUserData.phone,
          balance: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          loadDashboard(tempUserData.name, tempUserData.phone, 0);
        });

      }).catch((error) => {
        alert('Khabar OTP vul ba expired!');
      });
    }

    function loadDashboard(name, phone, balance) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = name;
      document.getElementById('user-display-phone').innerText = phone;
      document.getElementById('user-balance').innerText = balance;
    }

    function doTask() {
      alert('Ad dekhano hochhe...');
      setTimeout(() => {
        const user = auth.currentUser;
        if(user) {
          db.collection('users').doc(user.uid).update({
            balance: firebase.firestore.FieldValue.increment(5)
          }).then(() => {
            let curr = parseInt(document.getElementById('user-balance').innerText);
            document.getElementById('user-balance').innerText = curr + 5;
            alert('Apnar ৳5 joma hoyeche!');
          });
        }
      }, 2000);
    }

    function requestWithdraw() {
      const amt = parseInt(document.getElementById('wit-amt').value);
      const num = document.getElementById('wit-num').value;
      const user = auth.currentUser;

      if(amt < 200 || !num) return alert('Min ৳200 ebong Number din!');

      db.collection('withdraws').add({
        uid: user.uid,
        amount: amt,
        number: num,
        status: 'pending'
      }).then(() => {
        alert('Withdraw Request Pathano Hoyeche!');
      });
    }
  </script>
</body>
</html>
